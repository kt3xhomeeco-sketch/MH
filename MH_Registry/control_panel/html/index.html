<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MH Control Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-icon { display: inline-flex; align-items: center; justify-content: center; padding: 0; background: none; box-shadow: none; }
        .tab-icon svg { width: 22px; height: 22px; }
        #tab-content { position: relative; }
        .tab-panel { position: absolute; inset: 0; display: none; }
        .tab-panel.active { display: block; }
        .tab-panel iframe { width: 100%; height: 100%; border: 0; }
        .cp-launch { display:block; }
        .cp-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; border-bottom: 0.5px solid #d1d1d6; }
        .cp-header .cp-badge { width: 44px; height: 44px; border-radius: 11px; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg,#ffffff,#eef0f5); box-shadow: 0 1px 4px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.7); flex-shrink:0; }
        .cp-header .cp-badge svg { width: 27px; height: 27px; }
        .cp-header .cp-title { font-size: 16px; font-weight: 600; color: #1d1d1f; }
        .cp-header .cp-desc { font-size: 11.5px; color: #6e6e73; margin-top: 2px; line-height: 1.35; }
        .cp-actions { display: flex; flex-direction: column; gap: 7px; padding: 14px 16px; overflow:auto; }
        .cp-empty { color: #8e8e93; font-size: 12px; padding: 18px 16px; }
        .cp-dev-toggle { margin-top: 8px; font-size: 11.5px; color: #4A4473; cursor: pointer; user-select: none; }
        .cp-dev-toggle:hover { text-decoration: underline; }
        .cp-launchbar { padding: 10px 16px 0; display:flex; gap:7px; flex-wrap:wrap; }
        .cp-launchbar button { border:0; border-radius:7px; background:#4A4473; color:#fff; font-size:12px; padding:7px 12px; cursor:pointer; }
        .cp-launchbar button:hover { background:#3E3860; }
        .action-button-full { text-align: left; }
        .cp-frame-status { padding: 16px; color: #6e6e73; font-size: 12px; }
        .cp-frame-status button { margin-top: 10px; border:0; border-radius:7px; background:#4A4473; color:#fff; font-size:12px; padding:7px 12px; cursor:pointer; }
        .cp-form { padding: 16px; max-width: 760px; }
        .cp-form h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; color:#1d1d1f; }
        .cp-form-grid { display:grid; grid-template-columns: 1fr 160px; gap: 12px; align-items:end; }
        .cp-field { display:flex; flex-direction:column; gap:5px; margin-bottom: 12px; }
        .cp-field label { font-size: 11px; color:#6e6e73; }
        .cp-field input, .cp-field select, .cp-field textarea { border:1px solid #d1d1d6; border-radius:6px; padding:0 8px; font-size:12px; background:#fff; color:#1d1d1f; }
        .cp-field input, .cp-field select { height: 28px; }
        .cp-field textarea { padding:8px; font-family:Consolas,monospace; resize:vertical; min-height:88px; }
        .cp-field input:focus, .cp-field select:focus, .cp-field textarea:focus { outline:none; border-color:#4A4473; box-shadow:0 0 0 2px rgba(74,68,115,.10); }
        .cp-card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
        .cp-setting-card { border:1px solid #d8dbe2; background:#fff; border-radius:8px; padding:12px; }
        .cp-setting-card h3 { margin:0 0 10px; font-size:13px; font-weight:600; color:#1d1d1f; }
        .cp-setting-card .cp-field:last-child { margin-bottom:0; }
        .cp-wide-form { max-width:none !important; width:100%; box-sizing:border-box; }
        .cp-wide-form .cp-card-grid { grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); }
        .cp-setting-wide { grid-column:1 / -1; }
        .fr-settings-form { max-width:none !important; width:100%; box-sizing:border-box; }
        .fr-settings-form .cp-card-grid { grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); }
        .fr-setting-wide { grid-column:1 / -1; }
        .cp-note { color:#6e6e73; font-size:11.5px; line-height:1.4; margin:0 0 10px; }
        .cp-check-row { display:flex; align-items:center; gap:10px; min-height:28px; }
        .cp-check-row label { display:flex; align-items:center; gap:5px; color:#1d1d1f; font-size:12px; }
        .cp-check-row input { width:16px; height:16px; }
        .fr-keyword-list { display:flex; flex-direction:column; gap:7px; min-height:34px; }
        .fr-keyword-card { display:flex; align-items:center; gap:8px; min-height:34px; border:1px solid #d1d1d6; border-radius:8px; background:#fff; padding:5px 7px; }
        .fr-keyword-card.dragging { opacity:.45; border-style:dashed; }
        .fr-keyword-card.drag-over { border-color:#4A4473; box-shadow:0 0 0 2px rgba(74,68,115,.10); }
        .fr-keyword-grip { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:1px solid #d1d1d6; border-radius:8px; color:#6e6e73; cursor:grab; user-select:none; letter-spacing:-3px; font-size:14px; flex:0 0 auto; }
        .fr-keyword-grip:active { cursor:grabbing; }
        .fr-keyword-value { min-width:0; flex:1; height:26px; border:0 !important; background:transparent !important; padding:0 2px !important; color:#1d1d1f; font:700 12px/1.2 Consolas,monospace; }
        .fr-keyword-value:focus { outline:none; box-shadow:none !important; }
        .fr-keyword-delete { width:26px; height:26px; border:0; border-radius:6px; background:#fff; color:#c33; font-size:18px; line-height:1; cursor:pointer; flex:0 0 auto; }
        .fr-keyword-delete:hover { background:#fff1f1; }
        .fr-keyword-add-row { display:flex; gap:6px; align-items:center; margin-top:7px; }
        .fr-keyword-add-row input { flex:1; min-width:0; }
        .fr-pair-list { display:flex; flex-direction:column; gap:8px; min-height:34px; }
        .fr-pair-card { display:grid; grid-template-columns:34px minmax(180px,1fr) minmax(180px,1fr) 96px 28px; gap:8px; align-items:center; border:1px solid #d1d1d6; border-radius:8px; background:#fff; padding:6px; }
        .fr-pair-card.dragging { opacity:.45; border-style:dashed; }
        .fr-pair-card.drag-over { border-color:#4A4473; box-shadow:0 0 0 2px rgba(74,68,115,.10); }
        .fr-pair-card input, .fr-pair-card select { min-width:0; height:28px; border:1px solid #d1d1d6; border-radius:6px; padding:0 7px; font-size:12px; }
        .fr-pair-delete { width:26px; height:26px; border:0; border-radius:6px; background:#fff; color:#c33; font-size:18px; line-height:1; cursor:pointer; }
        .fr-pair-delete:hover { background:#fff1f1; }
        .cp-button-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top: 4px; }
        .cp-button-row button, .cp-inline-btn { border:0; border-radius:7px; background:#4A4473; color:#fff; font-size:12px; padding:7px 12px; cursor:pointer; }
        .cp-button-row button.secondary, .cp-inline-btn.secondary { background:#ffffff; color:#1d1d1f; border:1px solid #d1d1d6; }
        .cp-status { margin-top: 10px; font-size:12px; color:#2f8f5b; min-height:18px; }
        .cp-status.err { color:#dc3545; }
        /* --- Chip field (Assemble) --- */
        .chipfield { border:1px solid #d1d1d6; border-radius:8px; padding:6px; background:#fff; }
        .chipfield.dragover { border-color:#4A4473; box-shadow:0 0 0 2px rgba(74,68,115,.12); }
        .chip-chips { display:flex; flex-direction:column; gap:8px; min-height:34px; }
        .chip { display:grid; grid-template-columns:34px minmax(0,1fr) 28px; gap:8px; align-items:center; min-height:38px; background:#fff; border:1px solid #d1d1d6; color:#1d1d1f; border-radius:8px; padding:5px 6px; font-size:12px; max-width:100%; }
        .chip.dragging { opacity:.45; border-style:dashed; }
        .chip.drag-over { border-color:#9fb4ff; box-shadow:0 0 0 2px rgba(100,132,255,.18); }
        .chip .chip-grip { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:1px solid #d1d1d6; border-radius:8px; color:#6e6e73; background:#f2f2f7; cursor:grab; user-select:none; letter-spacing:-3px; font-size:14px; }
        .chip .chip-grip:active { cursor:grabbing; }
        .chip .chip-value { min-width:0; height:26px; border:0 !important; background:transparent !important; padding:0 2px !important; color:#1d1d1f; font:400 12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
        .chip .chip-value:focus { outline:none; box-shadow:none !important; }
        .chip .chip-del { width:26px; height:26px; border:0; border-radius:6px; background:#fff; color:#c33; font-size:20px; line-height:1; cursor:pointer; }
        .chip .chip-del:hover { background:#fff1f1; }
        .chip-empty { color:#b0b0b5; font-size:12px; padding:3px 4px; }
        .chip-row { display:flex; gap:6px; align-items:center; margin-top:6px; }
        .chip-input { flex:1; height:28px; border:1px solid #d1d1d6; border-radius:6px; padding:0 8px; font-size:12px; }
        .chip-input:focus { outline:none; border-color:#4A4473; }
        .chip-btn { border:0; border-radius:6px; background:#eef0f5; color:#1d1d1f; border:1px solid #d8dbe2; font-size:12px; padding:5px 9px; cursor:pointer; white-space:nowrap; }
        .chip-btn:hover { background:#e3e6ee; }
        .chip-raw { width:100%; box-sizing:border-box; min-height:80px; margin-top:6px; font-family:Consolas,monospace; font-size:12px; border:1px solid #d1d1d6; border-radius:6px; padding:6px; display:none; }
        .chipfield.raw .chip-chips, .chipfield.raw .chip-row .chip-input, .chipfield.raw .chip-pick { display:none; }
        .chipfield.raw .chip-raw { display:block; }
        /* picker popup */
        .mp-pop { position:fixed; z-index:9999; width:300px; max-height:320px; background:#fff; border:1px solid #c5ccd8; border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,.22); display:none; flex-direction:column; }
        .mp-pop.open { display:flex; }
        .mp-pop .mp-search { margin:8px; height:28px; border:1px solid #d1d1d6; border-radius:6px; padding:0 8px; font-size:12px; }
        .mp-pop .mp-list { overflow:auto; padding:0 8px 8px; }
        .mp-pop .mp-item { display:flex; align-items:center; gap:7px; padding:4px 4px; font-size:12px; border-radius:5px; cursor:pointer; }
        .mp-pop .mp-item:hover { background:#f2f3f7; }
        .mp-pop .mp-foot { display:flex; justify-content:space-between; align-items:center; padding:7px 8px; border-top:1px solid #eceef2; font-size:11px; color:#8e8e93; }
        .mp-pop .mp-foot button { border:0; border-radius:6px; background:#4A4473; color:#fff; font-size:12px; padding:5px 10px; cursor:pointer; }
        .mp-empty { color:#b0b0b5; font-size:12px; padding:8px 4px; }
        .scope-badge { display:inline-flex; align-items:center; justify-content:center; height:18px; padding:0 6px; border-radius:5px; font-size:10px; font-weight:700; margin-left:6px; vertical-align:middle; }
        .scope-global { background:#eef7ff; color:#146b96; border:1px solid #c8e6f5; }
        .scope-project { background:#fff4e6; color:#9a5a00; border:1px solid #ffd79a; }
        .cp-mini-table { width:100%; border-collapse:collapse; margin-bottom:8px; font-size:12px; }
        .cp-mini-table th, .cp-mini-table td { border:1px solid #d1d1d6; padding:5px; text-align:left; }
        .cp-mini-table th { color:#6e6e73; font-weight:600; background:#f5f6f8; }
        .cp-mini-table input[type="text"] { width:100%; height:26px; border:0; padding:0 5px; font-size:12px; background:#fff; color:#1d1d1f; }
        .cp-mini-table input[type="checkbox"] { width:16px; height:16px; }
        .cp-icon-btn { border:1px solid #d1d1d6; background:#fff; color:#1d1d1f; border-radius:6px; padding:4px 7px; cursor:pointer; }
        .ss-search-cell { display:flex; align-items:center; gap:6px; }
        .ss-search-shortcut-cell { display:flex; align-items:center; gap:5px; }
        .ss-search-shortcut-cell input { min-width:0; flex:1; }
        .ss-search-grip { color:#8e8e93; cursor:grab; user-select:none; letter-spacing:-3px; font-size:14px; flex:0 0 auto; }
        .ss-search-grip:active { cursor:grabbing; }
        .ss-search-row.dragging { opacity:.42; }
        .ss-search-row.drag-over td { border-top:2px solid #4A4473; }
        .ss-search-table input.ss-shortcut { text-align:center; font-family:Consolas,monospace; }
        .cp-ratio-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
        .cp-ratio-row button { border:1px solid #d1d1d6; background:#fff; color:#1d1d1f; border-radius:6px; padding:5px 9px; cursor:pointer; font-size:12px; }
        .cp-ratio-row button.active { background:#4A4473; color:#fff; border-color:#4A4473; }
        #cp-footer { position:absolute; right:12px; bottom:12px; z-index:70; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.96); border:1px solid #d1d1d6; box-shadow:0 4px 18px rgba(0,0,0,.16); border-radius:8px; padding:8px; }
        #cp-footer .dirty-dot { width:8px; height:8px; border-radius:50%; background:#c7c7cc; }
        #cp-footer.dirty .dirty-dot { background:#ff9f0a; }
        #cp-footer button { border:0; border-radius:7px; background:#4A4473; color:#fff; font-size:12px; padding:7px 10px; cursor:pointer; }
        #cp-footer button.secondary { background:#fff; color:#1d1d1f; border:1px solid #d1d1d6; }
        #cp-footer-status { color:#6e6e73; font-size:11px; max-width:240px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
        #cp-footer-status.err { color:#dc3545; }
    </style>
</head>
<body>

<div id="settings-container">
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Đang tải hệ thống MH...</div>
    </div>

    <div id="tabs">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tìm app hoặc lệnh..." oninput="handleSearch(this.value)" spellcheck="false" autocomplete="off">
        </div>
        <div class="tabs-list" id="tabs-list"></div>
        <div class="tabs-footer" onclick="toggleSidebar()">
            <span class="tabs-footer-label">Thu gọn danh mục</span>
            <span class="tabs-footer-icon">‹</span>
        </div>
    </div>

    <div id="tab-content"></div>
    <div id="cp-footer">
        <span class="dirty-dot"></span>
        <span id="cp-footer-status">Không có thay đổi chưa lưu.</span>
        <button type="button" onclick="saveAllDirty()">Lưu tất cả</button>
        <button class="secondary" type="button" onclick="exportConfigBackup()">Sao lưu XLSX</button>
        <button class="secondary" type="button" onclick="restoreConfigBackup()">Phục hồi XLSX</button>
    </div>
</div>

<script>
    // ---- Bộ icon màu (duotone) -----------------------------------------
    var P = '#4A4473', B = '#3CAFD6', K = '#D2759F', G = '#34c759', O = '#ff9f0a', GR='#8e8e93';
    var ICONS = {
        general:  svg('<rect x="3" y="3" width="18" height="18" rx="4" fill="'+P+'" opacity=".15"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="'+P+'" stroke-width="1.8"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2M6.6 6.6l1.4 1.4M16 16l1.4 1.4M17.4 6.6 16 8M8 16l-1.4 1.4" stroke="'+P+'" stroke-width="1.7" stroke-linecap="round"/>'),
        van:      svg('<rect x="3" y="5" width="18" height="6" rx="1.6" fill="'+B+'" opacity=".25"/><rect x="3" y="5" width="18" height="6" rx="1.6" fill="none" stroke="'+B+'" stroke-width="1.7"/><rect x="3" y="13" width="18" height="6" rx="1.6" fill="'+P+'" opacity=".18"/><rect x="3" y="13" width="18" height="6" rx="1.6" fill="none" stroke="'+P+'" stroke-width="1.7"/>'),
        canh:     svg('<rect x="5" y="3" width="14" height="18" rx="2" fill="'+K+'" opacity=".18"/><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="'+K+'" stroke-width="1.7"/><circle cx="9.5" cy="12" r="1.2" fill="'+K+'"/>'),
        thongke:  svg('<rect x="5" y="3" width="14" height="18" rx="2.2" fill="'+P+'" opacity=".14"/><rect x="5" y="3" width="14" height="18" rx="2.2" fill="none" stroke="'+P+'" stroke-width="1.7"/><path d="M9 8h6M9 12h6M9 16h4" stroke="'+B+'" stroke-width="1.8" stroke-linecap="round"/>'),
        superimp: svg('<path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" fill="none" stroke="'+P+'" stroke-width="1.7" stroke-linecap="round"/><path d="M12 3v9" stroke="'+B+'" stroke-width="1.8" stroke-linecap="round"/><path d="M8 8l4 4 4-4" fill="none" stroke="'+B+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'),
        rename:   svg('<path d="M3 7h9M3 12h6M3 17h6" stroke="'+P+'" stroke-width="1.8" stroke-linecap="round"/><path d="M15 15.5 19 11.5l2.2 2.2-4 4H15z" fill="'+O+'" opacity=".25"/><path d="M15 15.5 19 11.5l2.2 2.2-4 4H15z" fill="none" stroke="'+O+'" stroke-width="1.6" stroke-linejoin="round"/>'),
        fast_rename: svg('<path d="M3 7h8M3 12h5M3 17h5" stroke="'+P+'" stroke-width="1.8" stroke-linecap="round"/><path d="M16 3 11 13h4l-2 8 7-11h-4l1-7z" fill="'+O+'" opacity=".3"/><path d="M16 3 11 13h4l-2 8 7-11h-4l1-7z" fill="none" stroke="'+O+'" stroke-width="1.5" stroke-linejoin="round"/>'),
        select_similar: svg('<rect x="3" y="3" width="11" height="11" rx="2" fill="'+B+'" opacity=".2"/><rect x="3" y="3" width="11" height="11" rx="2" fill="none" stroke="'+B+'" stroke-width="1.7"/><rect x="10" y="10" width="11" height="11" rx="2" fill="'+P+'" opacity=".18"/><rect x="10" y="10" width="11" height="11" rx="2" fill="none" stroke="'+P+'" stroke-width="1.7"/>'),
        name:     svg('<path d="M4 5h16v11H9l-4 4V5z" fill="'+B+'" opacity=".18"/><path d="M4 5h16v11H9l-4 4V5z" fill="none" stroke="'+B+'" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 10h8" stroke="'+B+'" stroke-width="1.8" stroke-linecap="round"/>'),
        material: svg('<path d="M11 3l8.5 8.5-7 7a2.6 2.6 0 0 1-3.7 0l-4.3-4.3a2.6 2.6 0 0 1 0-3.7z" fill="'+K+'" opacity=".2"/><path d="M11 3l8.5 8.5-7 7a2.6 2.6 0 0 1-3.7 0l-4.3-4.3a2.6 2.6 0 0 1 0-3.7z" fill="none" stroke="'+K+'" stroke-width="1.7" stroke-linejoin="round"/><path d="M19 14c1.4 1.9 2 3 2 3.8a2 2 0 0 1-4 0c0-.8.6-1.9 2-3.8z" fill="'+O+'"/>'),
        assemble: svg('<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" fill="'+P+'" opacity=".14"/><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" fill="none" stroke="'+P+'" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9" stroke="'+B+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'),
        pk_addon: svg('<circle cx="9" cy="9" r="4.2" fill="'+B+'" opacity=".18"/><circle cx="9" cy="9" r="4.2" fill="none" stroke="'+B+'" stroke-width="1.7"/><path d="M9 5.2v7.6M5.2 9h7.6" stroke="'+B+'" stroke-width="1.5" stroke-linecap="round"/><path d="M13.5 13.5 20 20" stroke="'+P+'" stroke-width="1.9" stroke-linecap="round"/>'),
        registry: svg('<circle cx="12" cy="12" r="8.5" fill="'+P+'" opacity=".12"/><circle cx="12" cy="12" r="3" fill="none" stroke="'+P+'" stroke-width="1.8"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2" stroke="'+P+'" stroke-width="1.6" stroke-linecap="round"/>'),
        "default": svg('<rect x="4" y="4" width="16" height="16" rx="3.5" fill="'+GR+'" opacity=".15"/><rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke="'+GR+'" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="none" stroke="'+GR+'" stroke-width="1.7"/>')
    };
    function svg(inner){ return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'; }

    var DESCRIPTIONS = {
        "Thongke": "Thống kê BOM, HUD vật liệu/thông tin, import phụ kiện.",
        "Superimp": "Import nhanh cấu kiện DC, tự scale từ danh sách.",
        "Rename": "Đổi tên hàng loạt theo template & phím tắt.",
        "Fast Rename": "Đổi tên theo vùng/contact-plane, chia theo mã SP.",
        "Select Similar": "Chọn đối tượng tương tự, isolate/unisolate.",
        "Name": "Hiển thị nhãn tên đối tượng trong viewport.",
        "Material": "Gán vật liệu, import từ Excel/CSV/JSON.",
        "Assemble": "Dựng cây tủ/module, tạo bản vẽ.",
        "PK Addon": "Tạo & gắn marker phụ kiện (PK) vào đối tượng.",
        "Registry": "Trung tâm cấu hình & dữ liệu chung hệ MH."
    };
    var APP_ICON = {
        "Thongke":"thongke","Superimp":"superimp","Rename":"rename","Fast Rename":"fast_rename",

        "PK Addon":"pk_addon","Registry":"registry","Panel":"general","MH Panel":"general",

    function appIconFor(name) {
        var raw = String(name || '').trim();
        if (APP_ICON[raw]) return APP_ICON[raw];
        var n = raw.toLowerCase().replace(/^mh[\s_:-]*/,'').replace(/[_-]+/g,' ');
        if (n.indexOf('thongke') >= 0 || n.indexOf('thống kê') >= 0) return 'thongke';
        if (n.indexOf('superimp') >= 0 || n.indexOf('import') >= 0) return 'superimp';
        if (n.indexOf('fast') >= 0 && n.indexOf('rename') >= 0) return 'fast_rename';
        if (n.indexOf('rename') >= 0) return 'rename';
        if (n.indexOf('select') >= 0 || n.indexOf('similar') >= 0) return 'select_similar';
        if (n.indexOf('material') >= 0 || n.indexOf('vật liệu') >= 0 || n.indexOf('vat lieu') >= 0) return 'material';
        if (n.indexOf('assemble') >= 0) return 'assemble';
        if (n.indexOf('pk') >= 0 || n.indexOf('phụ kiện') >= 0 || n.indexOf('phu kien') >= 0) return 'pk_addon';
        if (n.indexOf('name') >= 0 || n.indexOf('nhãn') >= 0 || n.indexOf('nhan') >= 0) return 'name';
        if (n.indexOf('registry') >= 0 || n.indexOf('control') >= 0) return 'registry';
        if (n.indexOf('panel') >= 0) return 'general';
        return 'default';
    }

    function sidebarEntries() {
        var entries = [];
        SETTINGS_PANELS.forEach(function(p){ entries.push({ kind:'settings', id:p.id, label:p.label, icon:p.icon }); });
        REGISTRY_TABS.forEach(function(t){ entries.push({ kind:'registry', id:'reg_'+t.tab, label:t.label, icon:t.icon, tab:t.tab }); });
        NATIVE_PANELS.forEach(function(p){ entries.push({ kind:'native', id:p.id, label:p.label, icon:p.icon, panel:p }); });
        apps.forEach(function(a){
            if (a.name === 'Select Similar') return;
            if (a.name === 'Fast Rename') return;
            var label = a.name === 'PK Addon' ? 'PK Addon Tools' : a.name;
            if (a.name === 'Thongke') label = 'Thongke Tools';
            if (a.name === 'Assemble') label = 'Assemble Tools';
            if (a.name === 'Rename') label = 'Rename Tools';
            if (a.name === 'Name') label = 'Name Tools';
            entries.push({ kind:'app', id:'app_'+a.name, label:label, icon:appIconFor(a.name), app:a });
        });
        return entries;
    }

    function ensureRegistryIframe() {
        var panel = document.getElementById('panel_' + REGISTRY_PANEL.id);
        if (!panel) return null;
        var iframe = document.getElementById('iframe_' + REGISTRY_PANEL.id);
        if (iframe) return iframe;

        panel.innerHTML = '<iframe id="iframe_' + REGISTRY_PANEL.id + '" data-panel-id="' + REGISTRY_PANEL.id + '" data-id="' + REGISTRY_PANEL.id + '" src="' + REGISTRY_PANEL.src + '" frameborder="0"></iframe>'
            + '<div id="registryFallback" class="cp-frame-status" style="display:none">Không tải được nội dung Registry. Hãy đóng và mở lại MH Control Panel.</div>';
        iframe = document.getElementById('iframe_' + REGISTRY_PANEL.id);
        iframe.addEventListener('error', function () {
            var fb = document.getElementById('registryFallback');
            if (!fb) return;
            fb.style.display = '';
        });
        return iframe;
    }

    function showRegistryTab(tab) {
        var iframe = ensureRegistryIframe();
        registryPendingTab = tab || 'main';
        if (!iframe) {
            var panel = document.getElementById('panel_' + REGISTRY_PANEL.id);
            if (panel) panel.innerHTML = '<div class="cp-frame-status">Không tải được nội dung Registry. Hãy đóng và mở lại MH Control Panel.</div>';
            return;
        }
        if (registryReady) callRegistryOnShow(registryPendingTab);
    }

    function callRegistryOnShow(tab) {
        var ok = false;
        try {
            ok = window.MHControlPanel.callFrame('registry', 'MHRegSwitchTab', tab || 'main');
            if (!ok) ok = window.MHControlPanel.callEmbedded('registry', 'onShow', { tab: tab || 'main' });
        } catch (e) {
            ok = false;
        }
        if (!ok) registryPendingTab = tab || 'main';
    }

    // ---- Chip field logic ----------------------------------------------
    function renderAssembleChips(key) {
        var box = document.getElementById('chips_' + key);
        if (!box) return;
        var list = assembleLists[key] || [];
        if (!list.length) { box.innerHTML = '<span class="chip-empty">— chưa có —</span>'; return; }
        box.innerHTML = list.map(function(name, i){
            return '<div class="chip" draggable="true" data-as-key="' + escAttr(key) + '" data-as-index="' + i + '">' +
                   '<span class="chip-grip" title="Kéo để đổi vị trí">⋮⋮</span>' +
                   '<input class="chip-value" type="text" value="' + escAttr(name) + '" oninput="assembleEdit(\'' + key + '\',' + i + ',this.value)">' +
                   '<button class="chip-del" type="button" title="Xoá" onclick="assembleRemove(\'' + key + '\',' + i + ')">×</button>' +
                   '</div>';
        }).join('');
        wireAssembleChipCards(key);
    }
    function assembleMarkDirty() { DirtyStore.mark('assemble_settings', 'project'); }
    function syncAssembleListFromCards(key) {
        var box = document.getElementById('chips_' + key);
        if (!box || box.querySelector('.chip-empty')) return;
        var out = [];
        var seen = {};
        Array.prototype.forEach.call(box.querySelectorAll('.chip-value'), function(input){
            var value = String(input.value || '').trim();
            var lookup = value.toLowerCase();
            if (!value || seen[lookup]) return;
            seen[lookup] = true;
            out.push(value);
        });
        assembleLists[key] = out;
        var raw = document.getElementById('cfraw_' + key);
        if (raw) raw.value = out.join('\n');
    }
    function syncAllAssembleChipLists() {
        AS_FIELDS.forEach(function(f){ syncAssembleListFromCards(f.key); });
    }
    function assembleEdit(key, idx, value) {
        assembleLists[key] = assembleLists[key] || [];
        assembleLists[key][idx] = String(value || '');
        assembleMarkDirty();
    }
    function assembleAdd(key, name) {
        name = String(name || '').trim();
        if (!name) return;
        assembleLists[key] = assembleLists[key] || [];
        if (assembleLists[key].indexOf(name) === -1) {
            assembleLists[key].push(name);
            renderAssembleChips(key);
            assembleMarkDirty();
        }
    }
    function assembleRemove(key, idx) {
        if (!assembleLists[key]) return;
        assembleLists[key].splice(idx, 1);
        renderAssembleChips(key);
        assembleMarkDirty();
    }
    function wireAssembleChipCards(key) {
        var box = document.getElementById('chips_' + key);
        if (!box) return;
        Array.prototype.forEach.call(box.querySelectorAll('.chip'), function(card){
            card.addEventListener('dragstart', function(event){
                assembleChipDragging = card;
                card.classList.add('dragging');
                if (event.dataTransfer) event.dataTransfer.effectAllowed = 'move';
            });
            card.addEventListener('dragend', function(){
                card.classList.remove('dragging');
                document.querySelectorAll('.chip.drag-over').forEach(function(node){ node.classList.remove('drag-over'); });
                assembleChipDragging = null;
            });
            card.addEventListener('dragover', function(event){
                if (!assembleChipDragging || assembleChipDragging === card || assembleChipDragging.parentNode !== card.parentNode) return;
                event.preventDefault();
                card.classList.add('drag-over');
            });
            card.addEventListener('dragleave', function(){ card.classList.remove('drag-over'); });
            card.addEventListener('drop', function(event){
                if (!assembleChipDragging || assembleChipDragging === card || assembleChipDragging.parentNode !== card.parentNode) return;
                event.preventDefault();
                var boxRect = card.getBoundingClientRect();
                card.parentNode.insertBefore(assembleChipDragging, event.clientY < boxRect.top + boxRect.height / 2 ? card : card.nextSibling);
                card.classList.remove('drag-over');
                syncAssembleListFromCards(key);
                renderAssembleChips(key);
                assembleMarkDirty();
            });
        });
    }
    function assembleChipKey(ev, key) {
        if (ev.key === 'Enter' || ev.key === ',') {
            ev.preventDefault();
            var inp = ev.target;
            inp.value.split(',').forEach(function(v){ assembleAdd(key, v); });
            inp.value = '';
        } else if (ev.key === 'Backspace' && !ev.target.value && (assembleLists[key] || []).length) {
            assembleRemove(key, assembleLists[key].length - 1);
        }
    }
    function assembleToggleRaw(key) {
        var cf = document.getElementById('cf_' + key);
        if (!cf) return;
        var toRaw = !cf.classList.contains('raw');
        if (toRaw) {
            var raw = document.getElementById('cfraw_' + key);
            if (raw) raw.value = (assembleLists[key] || []).join('\n');
            cf.classList.add('raw');
        } else {
            cf.classList.remove('raw');
            renderAssembleChips(key);
        }
    }
    function assembleRawInput(key) {
        var raw = document.getElementById('cfraw_' + key);
        if (!raw) return;
        assembleLists[key] = splitLines(raw.value);
        assembleMarkDirty();
    }

    var _mpPop = null, _mpKey = null, _mpSrc = null;
    function ensureModelPicker() {
        if (_mpPop) return _mpPop;
        _mpPop = document.createElement('div');
        _mpPop.className = 'mp-pop';
        _mpPop.innerHTML = '<input class="mp-search" placeholder="Lọc tên..." oninput="renderModelPickerList(this.value)">' +
            '<div class="mp-list" id="mpList"></div>' +
            '<div class="mp-foot"><span id="mpCount"></span><button type="button" onclick="closeModelPicker()">Xong</button></div>';
        document.body.appendChild(_mpPop);
        document.addEventListener('click', function(e){
            if (_mpPop && _mpPop.classList.contains('open') && !_mpPop.contains(e.target) && !(e.target.classList && e.target.classList.contains('chip-pick'))) closeModelPicker();
        });
        return _mpPop;
    }
    function openModelPicker(key, src, btn) {
        _mpKey = key; _mpSrc = src;
        var pop = ensureModelPicker();
        var r = btn.getBoundingClientRect();
        var top = Math.min(r.bottom + 4, window.innerHeight - 330);
        var left = Math.min(r.left, window.innerWidth - 312);
        pop.style.top = Math.max(8, top) + 'px';
        pop.style.left = Math.max(8, left) + 'px';
        pop.querySelector('.mp-search').value = '';
        pop.classList.add('open');
        renderModelPickerList('');
    }
    function closeModelPicker() { if (_mpPop) _mpPop.classList.remove('open'); }
    function renderModelPickerList(filter) {
        var names = ASSEMBLE_MODEL_NAMES[_mpSrc] || [];
        var sel = assembleLists[_mpKey] || [];
        var q = (filter || '').toLowerCase();
        var shown = names.filter(function(n){ return !q || n.toLowerCase().indexOf(q) !== -1; });
        var list = document.getElementById('mpList');
        if (!shown.length) { list.innerHTML = '<div class="mp-empty">Không có tên nào trong model (hoặc model trống).</div>'; }
        else {
            list.innerHTML = shown.map(function(n){
                var checked = sel.indexOf(n) !== -1 ? ' checked' : '';
                return '<label class="mp-item"><input type="checkbox"' + checked + ' onchange="modelPickerToggle(this,' + JSON.stringify(n) + ')"><span>' + escHtml(n) + '</span></label>';
            }).join('');
        }
        var c = document.getElementById('mpCount');
        if (c) c.textContent = sel.length + ' đã chọn';
    }
    function modelPickerToggle(cb, name) {
        if (cb.checked) assembleAdd(_mpKey, name);
        else {
            var i = (assembleLists[_mpKey] || []).indexOf(name);
            if (i !== -1) assembleRemove(_mpKey, i);
        }
        var c = document.getElementById('mpCount');
        if (c) c.textContent = (assembleLists[_mpKey] || []).length + ' đã chọn';
    }

    function renderAssembleRatios(current, presets) {

        presets = (presets || [5,10,15,20,25,50,100]).map(function(n){ return parseInt(n, 10); }).filter(function(n){ return n > 0 && n <= 1000; });
        if (!presets.length) presets = [5,10,15,20,25,50,100];
        if (input) input.value = presets.join(', ');
        var ratios = ['auto'].concat(presets.map(String));
        box.innerHTML = '';

            var b = document.createElement('button');
            b.type = 'button';
            b.textContent = r === 'auto' ? 'AUTO' : '1:' + r;

                document.querySelectorAll('#as_ratio_buttons button').forEach(function(x){ x.classList.remove('active'); });
                b.classList.add('active');
                DirtyStore.mark('assemble_settings', 'project');
            };
            box.appendChild(b);
        });
        if (ratios.indexOf(String(current || 'auto')) < 0) setValue('as_custom_ratio', parseInt(current, 10) || '');

            };
        }).filter(function(row){ return row.key && row.label; });

    function parseNumberList(text) {
        var seen = {};
        return String(text || '').split(/[,\s;]+/).map(function(s){ return parseInt(s, 10); }).filter(function(n){
            if (!(n > 0 && n <= 1000) || seen[n]) return false;
            seen[n] = true;
            return true;
        });
    }

    function addFastRenameKeyword(key, value, markDirty) {
        value = String(value || '').trim();

        var exists = Array.prototype.some.call(list.querySelectorAll('.fr-keyword-value'), function(input){

        });
        if (exists) return;
        var card = document.createElement('div');

          '<span class="fr-keyword-grip" title="Kéo để đổi vị trí">⋮⋮</span>' +

    function addFastRenameKeywordFromInput(key) {

    function collectFastRenameKeywords(key) {

        if (!list) return [];
        var out = [];

        if (!searchQuery) return true;
        if (e.label.toLowerCase().includes(searchQuery)) return true;
        if (e.kind === 'app') return (e.app.actions||[]).some(function(x){ return (x.label||'').toLowerCase().includes(searchQuery); });

    function renderSidebar() {
        var list = document.getElementById('tabs-list');
        list.innerHTML = '';
        sidebarEntries().forEach(function(e){
            var div = document.createElement('div');
            div.className = 'tab' + (e.id === currentId ? ' active' : '') + (entryMatches(e) ? '' : ' search-hidden');
            div.innerHTML = '<span class="tab-icon">'+iconFor(e.icon)+'</span>'+escHtml(e.label);
            div.addEventListener('click', function(){ switchTo(e.id); });
            list.appendChild(div);
        });
    }

    function switchTo(id) {
        currentId = id;
        renderSidebar();
        // hide all
        document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
        var reg = REGISTRY_TABS.find(function(t){ return 'reg_' + t.tab === id; });
        if (reg) {
            var rp = document.getElementById('panel_' + REGISTRY_PANEL.id);
            if (rp) rp.classList.add('active');
            showRegistryTab(reg.tab);
            return;
        }
        var nativePanel = NATIVE_PANELS.find(function(p){ return p.id === id; });
        if (nativePanel) {
            var np = document.getElementById('panel_' + id);
            if (np) np.classList.add('active');
            if (nativePanel.type === 'pk_settings') loadPkSettingsRequest();
            if (nativePanel.type === 'thongke_panel') loadThongkePanelRequest();
            if (nativePanel.type === 'assemble_settings') loadAssemblePanelRequest();
            if (nativePanel.type === 'select_similar_settings' && !DirtyStore.sections.select_similar_settings) loadSelectSimilarPanelRequest();
            if (nativePanel.type === 'fast_rename_settings' && !DirtyStore.sections.fast_rename_settings) loadFastRenameSettingsRequest();
            if (nativePanel.type === 'viewport_names_settings') loadViewportNamesPanelRequest();
            return;
        }
        var sp = SETTINGS_PANELS.find(function(p){ return p.id === id; });
        if (sp) {
            var el = document.getElementById('panel_'+id);
            if (el) el.classList.add('active');
            if (settingsLoaded && iframesReady[id]) sendSettingsToIframe(id);
            else if (settingsLoaded) pendingLoad[id] = true;
        } else {
            var lp = document.getElementById('panel_launcher');
            lp.classList.add('active');
            renderLauncher(id);
        }
    }

    function renderLauncher(id) {
        var app = apps.find(function(a){ return 'app_'+a.name === id; });
        var body = document.getElementById('cp-launch-body');
        if (!app) { body.innerHTML = '<div class="cp-empty">—</div>'; return; }
        var slug = appIconFor(app.name);
        var html = '<div class="cp-header"><div class="cp-badge">'+iconFor(slug)+'</div><div><div class="cp-title">'+escHtml(app.name)+'</div>'
                 + (appDescriptionFor(app.name) ? '<div class="cp-desc">'+appDescriptionFor(app.name)+'</div>' : '') + '</div></div>';
        var actions = (app.actions||[]).slice();
        if (searchQuery) actions = actions.filter(function(a){ return a.label.toLowerCase().includes(searchQuery); });
        var normal = actions.filter(function(a){ return !/^dev:/i.test(a.label); });
        var dev = actions.filter(function(a){ return /^dev:/i.test(a.label); });
        html += '<div class="cp-actions">';
        if (!normal.length && !dev.length) html += '<div class="cp-empty">Không có lệnh phù hợp.</div>';
        normal.forEach(function(a){ html += '<button class="action-button-full" style="padding:8px 12px;" onclick="invokeAction(\''+esc(app.name)+'\',\''+esc(a.key)+'\')">'+escHtml(a.label)+'</button>'; });
        if (dev.length) {
            html += '<div class="cp-dev-toggle" onclick="toggleDev(\''+esc(app.name)+'\')">'+(showDev[app.name]?'▾':'▸')+' Lệnh phát triển ('+dev.length+')</div>';
            if (showDev[app.name]) dev.forEach(function(a){ html += '<button class="action-button-full" style="padding:7px 12px;opacity:.85;" onclick="invokeAction(\''+esc(app.name)+'\',\''+esc(a.key)+'\')">'+escHtml(a.label)+'</button>'; });
        }
        html += '</div>';
        body.innerHTML = html;
    }
    function toggleDev(name){ showDev[name] = !showDev[name]; renderLauncher('app_'+name); }

    function esc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
    function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    function invokeAction(app, key){
        if (app === 'Panel' && window.sketchup && window.sketchup.activate_panel_tool) {
            window.sketchup.activate_panel_tool(key);
            return;
        }
        var params = app + '@' + key;
        if (window.sketchup && window.sketchup.invoke) window.sketchup.invoke(params);
        else window.location.href = 'skp:invoke@' + params;
    }

    function handleSearch(v){ searchQuery=(v||'').trim().toLowerCase(); renderSidebar(); if(currentId && currentId.indexOf('app_')===0) renderLauncher(currentId); }

    // ---- Định tuyến settings tới iframe ---------------------------------
    function sectionOf(id){ var p = SETTINGS_PANELS.find(function(x){return x.id===id;}); return p ? p.section : id; }

    function sendSettingsToIframe(id){
        var iframe = document.getElementById('iframe_'+id);
        if (!iframe || !iframe.contentWindow) return;
        var section = sectionOf(id);
        iframe.contentWindow.postMessage({ action:'loadSettings', settings: allSettings[section] || {}, hideUnavailable:true }, '*');
    }

    window.loadAllSettings = function(data){
        allSettings = data || {};
        settingsLoaded = true;
        SETTINGS_PANELS.forEach(function(p){ if (iframesReady[p.id]) sendSettingsToIframe(p.id); });
        hideLoading();
    };
    window.loadApps = function(data){
        apps = (data||[]).filter(function(a){ return a.name !== 'Panel'; });
        renderSidebar();
        if (!currentId) switchTo(SETTINGS_PANELS[0].id);
    };
    window.sendPresetsToIframe = function(section, presets, collapsed){
        var p = SETTINGS_PANELS.find(function(x){return x.section===section;});
        if (!p) return;
        var iframe = document.getElementById('iframe_'+p.id);
        if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ action:'presets_loaded', presets:presets, collapsedGroups:collapsed }, '*');
    };
    window.sendSettingsToIframeData = function(section, settings){
        var p = SETTINGS_PANELS.find(function(x){return x.section===section;});
        if (!p) return;
        var iframe = document.getElementById('iframe_'+p.id);
        if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ action:'preset_settings_loaded', settings:settings }, '*');
    };

    window.MHControlPanel = {
        frameReady: function(panelId) {
            if (panelId === 'registry') {
                registryReady = true;
                if (registryPendingTab) setTimeout(function(){ callRegistryOnShow(registryPendingTab); }, 40);
            }
        },
        callFrame: function(panelId, fnName, payload) {
            var frame = document.querySelector('iframe[data-panel-id="' + panelId + '"]');
            if (!frame || !frame.contentWindow) return false;
            var fn = frame.contentWindow[fnName];
            if (typeof fn !== 'function') return false;
            return fn(payload) !== false;
        },
        callEmbedded: function(panelId, methodName, payload) {
            var frame = document.querySelector('iframe[data-panel-id="' + panelId + '"]');
            if (!frame || !frame.contentWindow || !frame.contentWindow.MHEmbedded) return false;
            var fn = frame.contentWindow.MHEmbedded[methodName];
            if (typeof fn !== 'function') return false;
            return fn(payload) !== false;
        }
    };

    // sketchup-bridge trả Promise qua dlg.execute_script ở top frame.
    // Registry bridge chạy trong iframe, nên top frame cần relay response về iframe.
    window.Bridge = window.Bridge || {};
    window.Bridge.requestHandler = window.Bridge.requestHandler || {};
    window.Bridge.requestHandler.receive = function(id, payload) {
        var frame = document.querySelector('iframe[data-panel-id="registry"]');
        if (!frame || !frame.contentWindow || !frame.contentWindow.Bridge || !frame.contentWindow.Bridge.requestHandler) return;
        frame.contentWindow.Bridge.requestHandler.receive(id, payload);
    };

    // ---- Lắng nghe message từ iframe (giống openzsu caidat) -------------
    window.addEventListener('message', function(event){
        var d = event.data; if (!d || !d.action) return;
        switch (d.action) {
            case 'iframe_ready': {
                var id = d.tabId;
                iframesReady[id] = true;
                if (settingsLoaded && (id === currentId || pendingLoad[id])) { setTimeout(function(){ sendSettingsToIframe(id); pendingLoad[id]=false; }, 80); }
                break;
            }
            case 'mh_embedded_ready': {
                if (d.panelId && window.MHControlPanel) window.MHControlPanel.frameReady(d.panelId);
                break;
            }
            case 'save_setting': {
                var section = sectionOf(d.tabId || currentId);
                if (!allSettings[section]) allSettings[section] = {};
                allSettings[section][d.key] = d.value;
                var val = (typeof d.value === 'object') ? JSON.stringify(d.value) : d.value;
                skp('save_setting', section + '@' + d.key + '@' + val);
                break;
            }
            case 'load_presets':   skpPresets('load_presets', sectionOf(d.tabId)); break;
            case 'save_preset':    skp('save_preset', sectionOf(d.tabId) + '@' + d.presetName + '@' + JSON.stringify(d.settings)); break;
            case 'load_preset':    skp('load_preset', sectionOf(d.tabId) + '@' + d.presetName); break;
            case 'delete_preset':  skp('delete_preset', sectionOf(d.tabId) + '@' + d.presetName); break;
            case 'save_presets_order': skp('save_presets_order', sectionOf(d.tabId) + '@' + JSON.stringify(d.presets)); break;
            case 'save_collapsed_groups': skp('save_collapsed_groups', sectionOf(d.tabId) + '@' + JSON.stringify(d.collapsedGroups)); break;
            case 'export_settings': skp('export_settings'); break;
            case 'import_settings': skp('import_settings'); break;
            case 'reset_settings':  skp('reset_settings'); break;
            case 'reset_section':   skp('reset_section', sectionOf(d.tabId)); break;
        }
    });

    function skp(name, params){ if (window.sketchup && window.sketchup[name]) { params===undefined?window.sketchup[name]():window.sketchup[name](params); } else { window.location.href='skp:'+name+(params!==undefined?'@'+params:''); } }
    function skpPresets(name, section){ if (window.sketchup && window.sketchup.load_presets) window.sketchup.load_presets(section); else window.location.href='skp:load_presets@'+section; }

    function hideLoading(){ var o=document.getElementById('loading-overlay'); if(o){ o.classList.add('fade-out'); setTimeout(function(){o.style.display='none';},300);} }

    function boot(){
        buildContent();
        renderSidebar();
        switchTo(SETTINGS_PANELS[0].id);
        skp('load_apps');
        skp('load_settings');
    }
    window.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 100); });
    if (document.readyState !== 'loading') setTimeout(boot, 100);

    // ---- Thu gọn sidebar -------------------------------------------------
    function setTabTextVisible(v){ var t=document.getElementById('tabs'); var l=document.querySelector('.tabs-footer-label'); if(v)t.classList.remove('hide-text'); else t.classList.add('hide-text'); if(l)l.style.opacity=v?'1':'0'; }
    function toggleSidebar(){ var t=document.getElementById('tabs'); var ic=document.querySelector('.tabs-footer-icon'); var col=!t.classList.contains('collapsed'); if(col){setTabTextVisible(false);t.classList.add('collapsed');}else{t.classList.remove('collapsed');setTabTextVisible(false);setTimeout(function(){setTabTextVisible(true);},200);} ic.textContent=col?'›':'‹'; }
</script>

</body>
