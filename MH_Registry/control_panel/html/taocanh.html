<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cài Đặt Tạo Cánh</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/vue.min.js"></script>
    <script src="js/setting.js"></script>
</head>
<body>

<div id="app" class="container">
    <div class="col2">
        <h3>Phương pháp</h3>

        <div class="switch" title="Phương pháp vẽ hình tổng thể.">
            <span>Phương pháp vẽ</span>
            <div class="select-group">
                <select v-model="settings.phuong_phap_ve" @change="saveSetting('phuong_phap_ve')">
                    <option value="2_diem">2 điểm</option>
                    <option value="3_diem">3 điểm</option>
                    <option value="tu_do">Tự do</option>
                    <option value="chon_theo_canh">Chọn theo cạnh</option>
                    <option value="chon_theo_mat">Chọn theo mặt</option>
                    <option value="tam">Tấm</option>
                    <option value="bounding_box">Bounding Box</option>
                </select>
            </div>
        </div>

        <div class="switch" title="Các cánh được tạo sẽ trở thành component với nhau.">
            <span>Tạo component</span>
            <input type="checkbox" v-model="settings.tao_component" @change="saveSetting('tao_component')" id="tao_component">
            <label class="switch-label" for="tao_component"></label>
        </div>

        <h3>Độ dày</h3>

        <div class="switch" title="Độ dày của cánh được tạo ra.">
            <span>Độ dày ván</span>
            <div class="number-input-group">
                <button class="spinner-btn" @click="decrementValue('do_day')">−</button>
                <input type="number" v-model.number="settings.do_day" @change="saveSetting('do_day')" @blur="validateNumber('do_day')" step="0.1">
                <button class="spinner-btn" @click="incrementValue('do_day')">+</button>
            </div>
        </div>

        <div class="switch" title="Khoảng cách từ cánh đến mặt gốc theo chiều sâu.">
            <span>Cánh cách mặt gốc</span>
            <div class="number-input-group">
                <button class="spinner-btn" @click="decrementValue('canh_cach_mat_goc')">−</button>
                <input type="number" v-model.number="settings.canh_cach_mat_goc" @change="saveSetting('canh_cach_mat_goc')" @blur="validateNumber('canh_cach_mat_goc')" step="0.1">
                <button class="spinner-btn" @click="incrementValue('canh_cach_mat_goc')">+</button>
            </div>
        </div>

        <h3>Thông tin</h3>

        <div class="switch" title="Instance của các cánh được tạo ra.">
            <span>Instance</span>
            <div class="text-input-group">
                <input type="text" v-model="settings.instance" @input="saveSetting('instance')" placeholder="Nhập tên instance">
            </div>
        </div>

        <div class="switch" title="Layer (tag) của các cánh được tạo ra.">
            <span>Layer</span>
            <div class="text-input-group">
                <input type="text" v-model="settings.layer" @input="saveSetting('layer')" placeholder="Nhập tên layer">
            </div>
        </div>

        <h3>Khoảng hở</h3>

        <div class="switch" title="Các hở biên ngoài hở đều bằng nhau.">
            <span>Hở đều biên ngoài</span>
            <input type="checkbox" v-model="settings.ho_deu_bien_ngoai" @change="saveSetting('ho_deu_bien_ngoai')" id="ho_deu_bien_ngoai">
            <label class="switch-label" for="ho_deu_bien_ngoai"></label>
        </div>

        <div class="switch" :class="{ collapsed: hideUnavailable && !settings.ho_deu_bien_ngoai }" title="Khoảng hở của biên ngoài (áp dụng đều 4 cạnh).">
            <span>Hở biên ngoài</span>
            <div class="number-input-group">
                <button class="spinner-btn" @click="decrementValue('ho_bien_ngoai')">−</button>
                <input type="number" v-model.number="settings.ho_bien_ngoai" @change="saveSetting('ho_bien_ngoai')" @blur="validateNumber('ho_bien_ngoai')" step="0.1">
                <button class="spinner-btn" @click="incrementValue('ho_bien_ngoai')">+</button>
            </div>
        </div>

        <div class="switch" :class="{ collapsed: hideUnavailable && settings.ho_deu_bien_ngoai }" title="Khoảng hở biên trái.">
            <span>Hở trái</span>
            <div class="number-input-group">
                <button class="spinner-btn" @click="decrementValue('ho_trai')">−</button>
                <input type="number" v-model.number="settings.ho_trai" @change="saveSetting('ho_trai')" @blur="validateNumber('ho_trai')" step="0.1">
                <button class="spinner-btn" @click="incrementValue('ho_trai')">+</button>
            </div>
        </div>

        <div class="switch" :class="{ collapsed: hideUnavailable && settings.ho_deu_bien_ngoai }" title="Khoảng hở biên phải.">
            <span>Hở phải</span>
            <div class="number-input-group">
                <button class="spinner-btn" @click="decrementValue('ho_phai')">−</button>
                <input type="number" v-model.number="settings.ho_phai" @change="saveSetting('ho_phai')" @blur="validateNumber('ho_phai')" step="0.1">
                <button class="spinner-btn" @click="incrementValue('ho_phai')">+</button>
            </div>
        </div>

        <div class="switch" :class="{ collapsed: hideUnavailable && settings.ho_deu_bien_ngoai }" title="Khoảng hở biên trên.">
            <span>Hở trên</span>
            <div class="number-input-group">
                <button class="spinner-btn" @click="decrementValue('ho_tren')">−</button>
                <input type="number" v-model.number="settings.ho_tren" @change="saveSetting('ho_tren')" @blur="validateNumber('ho_tren')" step="0.1">
                <button class="spinner-btn" @click="incrementValue('ho_tren')">+</button>
            </div>
        </div>

        <div class="switch" :class="{ collapsed: hideUnavailable && settings.ho_deu_bien_ngoai }" title="Khoảng hở biên dưới.">
            <span>Hở dưới</span>
            <div class="number-input-group">
                <button class="spinner-btn" @click="decrementValue('ho_duoi')">−</button>
                <input type="number" v-model.number="settings.ho_duoi" @change="saveSetting('ho_duoi')" @blur="validateNumber('ho_duoi')" step="0.1">
                <button class="spinner-btn" @click="incrementValue('ho_duoi')">+</button>
            </div>
        </div>

        <div class="switch" title="Khoảng hở giữa các cánh khi chia tầng hoặc khoang.">
            <span>Hở giữa các cánh</span>
            <div class="number-input-group">
                <button class="spinner-btn" @click="decrementValue('ho_giua_cac_canh')">−</button>
                <input type="number" v-model.number="settings.ho_giua_cac_canh" @change="saveSetting('ho_giua_cac_canh')" @blur="validateNumber('ho_giua_cac_canh')" step="0.1">
                <button class="spinner-btn" @click="incrementValue('ho_giua_cac_canh')">+</button>
            </div>
        </div>

        <h3>Kích thước</h3>

        <div class="switch" title="Hiển thị kích thước từng cánh trong khi vẽ.">
            <span>Hiển thị kích thước</span>
            <input type="checkbox" v-model="settings.hien_thi_kich_thuoc" @change="saveSetting('hien_thi_kich_thuoc')" id="hien_thi_kich_thuoc">
            <label class="switch-label" for="hien_thi_kich_thuoc"></label>
        </div>
    </div>

    <div id="preset-panel"></div>
</div>

<script>
    Vue.config.productionTip = false;
    Vue.config.devtools = false;
    document.body.spellcheck = false;

    new Vue({
        el: '#app',
        mixins: [SettingsMixin('tao_canh')],
        data: {
            settings: {
                phuong_phap_ve: '2_diem',
                tao_component: false,
                do_day: 17.5,
                canh_cach_mat_goc: 0.0,
                instance: '',
                layer: '',
                ho_deu_bien_ngoai: true,
                ho_bien_ngoai: 2.0,
                ho_trai: 2.0,
                ho_phai: 2.0,
                ho_tren: 2.0,
                ho_duoi: 2.0,
                ho_giua_cac_canh: 2.0,
                hien_thi_kich_thuoc: false
            }
        },
        methods: {}
    });
</script>

</body>
</html>
